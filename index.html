<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>过期友情人格测试｜后会友期</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f7f2e9;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d8cdbe' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");
            min-height: 100vh;
            padding: 20px 16px;
            color: #4b4237;
        }
        .watermark {
            position: fixed;
            top:12px;
            left:12px;
            font-size:12px;
            color:#c9bca9;
            letter-spacing:1px;
            z-index: 1;
        }
        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #fffbf5;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 6px 18px rgba(139,121,99,0.12);
            border: 1px solid #e9e0d3;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top:0;
            left:0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg,#94a892,#b8c7b6);
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(8px);}
            to {opacity:1; transform: translateY(0);}
        }
        .home h1 {
            font-size: 24px;
            color:#576b55;
            text-align:center;
            margin-bottom:12px;
            letter-spacing:1px;
        }
        .home .sub {
            text-align:center;
            font-size:14px;
            color:#7a6f60;
            line-height:1.6;
            margin-bottom:24px;
        }
        .tag-group {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            justify-content:center;
            margin-bottom:28px;
        }
        .tag {
            background:#edf2ec;
            color:#627760;
            padding:4px 10px;
            border-radius:99px;
            font-size:13px;
        }
        .btn {
            width:100%;
            border:none;
            padding:14px;
            border-radius:12px;
            font-size:16px;
            background:#94a892;
            color:white;
            cursor:pointer;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover {
            background:#80947e;
        }
        .btn:active {
            opacity:0.85;
        }
        .progress-box {
            margin-bottom:18px;
        }
        .progress-text {
            font-size:13px;
            color:#827564;
            margin-bottom:6px;
            text-align:right;
        }
        .progress-bar {
            width:100%;
            height:6px;
            background:#e9e0d3;
            border-radius:99px;
            overflow:hidden;
        }
        .progress-fill {
            height:100%;
            background:#94a892;
            transition: width 0.35s ease;
        }
        .q-title {
            font-size:17px;
            line-height:1.6;
            margin-bottom:22px;
        }
        .opt-item {
            background:#f7f2e9;
            border:1px solid #e3d9cb;
            border-radius:12px;
            padding:14px 16px;
            margin-bottom:10px;
            cursor:pointer;
            transition: all 0.22s;
            -webkit-tap-highlight-color: transparent;
        }
        .opt-item:hover {
            background:#edf2ec;
            border-color:#b8c7b6;
        }
        .opt-item:active {
            background:#e5ede4;
        }
        .res-title {
            font-size:22px;
            color:#576b55;
            text-align:center;
            margin-bottom:10px;
        }
        .res-tagline{
            text-align:center;
            color:#706454;
            font-size:14px;
            margin-bottom:8px;
        }
        .res-desc {
            background:#f7f2e9;
            padding:18px;
            border-radius:14px;
            line-height:1.7;
            margin:18px 0 12px;
        }
        .res-tip{
            font-size:13px;
            color:#827564;
            background:#fff1dc;
            padding:10px;
            border-radius:10px;
            margin-bottom:16px;
        }
        .tie-fen-note{
            font-size:13px;
            color:#946c48;
            text-align:center;
            margin-bottom:14px;
        }
    </style>
</head>
<body>
<div class="watermark">Tami</div>
<div class="wrap">
    <div class="page active" id="page-home">
        <div class="card home">
            <h1>过期友情人格测试</h1>
            <p class="sub">跟着《后会友期》，看看你面对渐行渐远的旧友，是什么模样<br>一共9题，凭第一直觉选择</p>
            <div class="tag-group">
                <span class="tag">执念型</span>
                <span class="tag">释然型</span>
                <span class="tag">和解型</span>
                <span class="tag">回避型</span>
            </div>
            <button class="btn" onclick="startTest()">开始测试</button>
        </div>
    </div>

    <div class="page" id="page-question">
        <div class="card">
            <div class="progress-box">
                <div class="progress-text">第 <span id="q-index">1</span> / 9 题</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 11%"></div>
                </div>
            </div>
            <div class="q-title" id="q-text"></div>
            <div id="opt-list"></div>
        </div>
    </div>

    <div class="page" id="page-result">
        <div class="card">
            <h2 class="res-title" id="res-name"></h2>
            <p class="res-tagline" id="res-tag"></p>
            <div class="tie-fen-note" id="tieFenNote"></div>
            <div class="res-desc" id="res-text"></div>
            <div class="res-tip" id="res-smalltip"></div>
            <button class="btn" onclick="restart()">重新测一次</button>
        </div>
    </div>
</div>

<script>
const questions = [
    {
        q:"很久没联系的旧友，突然发来消息邀约见面，你的第一反应？",
        opts:[
            {text:"A. 内心翻涌出很多当年没说出口的话，纠结要不要趁这次把心结说清楚",type:"A"},
            {text:"B. 淡淡感慨，过去早就过去了，可以见，但不会期待太多",type:"B"},
            {text:"C. 觉得是很好的机会，愿意赴约，希望两个人可以好好聊聊",type:"C"},
            {text:"D. 下意识想婉拒，不太想重新拾起这段已经停下的关系",type:"D"}
        ]
    },
    {
        q:"回想当初你们渐行渐远，你更倾向认为是？",
        opts:[
            {text:"A. 中间藏着一场没有解开的误会，一直耿耿于怀",type:"A"},
            {text:"B. 只是人生道路自然分叉，没有谁的错，只是不再同路",type:"B"},
            {text:"C. 双方当时都不懂怎么沟通，错过了修复关系的时机",type:"C"},
            {text:"D. 慢慢冷淡是最好的结局，早分开减少后续更多矛盾",type:"D"}
        ]
    },
    {
        q:"如果重逢聊天，对方提起当年那件让你们产生隔阂的往事，你会？",
        opts:[
            {text:"A. 抓住机会，认真说出当年自己委屈的地方，想要一个答案",type:"A"},
            {text:"B. 轻描淡写带过，不愿反复咀嚼旧情绪",type:"B"},
            {text:"C. 冷静交流，一起复盘当时双方的想法，争取互相理解",type:"C"},
            {text:"D. 希望快速跳过这个话题，不想再讨论这件令人难受的往事",type:"D"}
        ]
    },
    {
        q:"一段友情已经搁置很多年，你还会偷偷留意对方近况吗？",
        opts:[
            {text:"A. 偶尔会，心里一直放不下当初那段关系的结局",type:"A"},
            {text:"B. 偶然刷到会看一眼，但内心早已没有波澜",type:"B"},
            {text:"C. 如果有机会会愿意了解，但不会主动偷偷去窥探",type:"C"},
            {text:"D. 不会主动关注，分开之后就选择互不打扰",type:"D"}
        ]
    },
    {
        q:"你心中一段友情最好的收尾方式是？",
        opts:[
            {text:"A. 要有正式的和解或者一个明确的答案，不能不清不楚地消散",type:"A"},
            {text:"B. 安静退场，不必刻意告别，各自安好就是最好结果",type:"B"},
            {text:"C. 能解开矛盾最好，就算不能，也体面地好好道别",type:"C"},
            {text:"D. 无声淡出，不需要专门见面或者对话画上句号",type:"D"}
        ]
    },
    {
        q:"假如重逢之后发现，你们两个人三观已经完全不一样了，你会？",
        opts:[
            {text:"A. 很难接受，会遗憾当初那么要好，如今隔阂这么深",type:"A"},
            {text:"B. 坦然接受，人本来就是会变的",type:"B"},
            {text:"C. 尊重彼此变化，好好聊完这一次，然后顺其自然",type:"C"},
            {text:"D. 更加确定这段关系不适合继续，保持距离",type:"D"}
        ]
    },
    {
        q:"如果见面之后对方并没有打算和你聊当年的矛盾，只是单纯闲聊叙旧，你会？",
        opts:[
            {text:"A. 内心有点失落，还是期待能把当年的心结摊开说一次",type:"A"},
            {text:"B. 无所谓，闲聊也挺好，不一定非要翻旧账",type:"B"},
            {text:"C. 先轻松闲聊，观察时机，合适的时候再提起过往",type:"C"},
            {text:"D. 觉得这样刚刚好，不必再触碰过去矛盾",type:"D"}
        ]
    },
    {
        q:"假设这次重逢结束，对方提出以后可以常联系，你的想法？",
        opts:[
            {text:"A. 会期待，希望慢慢弥补当年错过的友情",type:"A"},
            {text:"B. 礼貌回应，但心里清楚很难回到从前",type:"B"},
            {text:"C. 愿意维持淡淡的联系，顺其自然发展",type:"C"},
            {text:"D. 礼貌应付，后续不会主动开启聊天",type:"D"}
        ]
    },
    {
        q:"多年过去，回头看这段友情，你最大的情绪是？",
        opts:[
            {text:"A. 遗憾，如果当初做出不同选择结果或许不同",type:"A"},
            {text:"B. 感恩曾经相伴，离别只是人生常态",type:"B"},
            {text:"C. 可惜，但如果有机会依然愿意和解",type:"C"},
            {text:"D. 觉得走到散场就是这段关系注定的终点",type:"D"}
        ]
    }
];

const results = {
    A:{
        name:"✊ 执念型",
        tag:"标签：困于旧答案，心底画地为牢",
        desc:"你属于心里很难轻易放下遗憾的一类人。\n曾经要好的朋友慢慢走散这件事，在你心里一直悬着，你常常会设想，如果当初好好沟通，结局会不会不一样。\n你期待一场重逢，本质上不是非要继续做朋友，而是想要当年那个迟迟没有到来的解释。\n你一直困在过去的情绪里面，等待一句答复。",
        tip:"💡小提示：很多故事本就没有标准答案，有时候放过回忆，也是放过自己。"
    },
    B:{
        name:"🧊 释然型",
        tag:"标签：往事翻篇，体面独行",
        desc:"你早已接受友情是阶段性这件事。\n想起曾经的好友，你还能记得当初相处的美好，但不会为已经走散的关系内耗。\n就算再次见面，你可以温和交谈，却不会再期盼回到当初亲密的模样。\n人生本就是不断有人来，有人离开，分叉只是常态，你已经与这段过期的友情和解，不再纠结对错。",
        tip:"💡小提示：能坦然接纳离别，本身也是一种强大。"
    },
    C:{
        name:"🤝 和解型",
        tag:"标签：愿意沟通，尽力不留遗憾",
        desc:"你是最愿意给旧友情一次机会的人格。\n如果有重逢的机会，你愿意坐下来，平静聊聊当年发生的一切。\n你不强求一定要变回最好的朋友，但你不想带着误解一直错过。\n你认为人与人之间的隔阂大多来自缺少沟通，能解开就解开，若是最后依旧无法同行，也能不留遗憾地好好告别。",
        tip:"💡小提示：你一直保有真诚沟通的勇气，很难得。"
    },
    D:{
        name:"🚶 回避型",
        tag:"标签：不愿重逢，断联即是归宿",
        desc:"对于已经走向终点的友情，你的选择是不回头。\n你明白再见面很可能只会徒增尴尬或是再次勾起不愉快的回忆，比起勉强见面，你更愿意保持现在互不打扰的状态。\n不是怨恨对方，只是你觉得关系既然已经走到这里，最好的选择就是到此为止，不必强行重启。",
        tip:"💡小提示：回避不是胆小，只是你清楚哪些关系不必再勉强。"
    }
};

let current = 0;
let count = {A:0,B:0,C:0,D:0};
let lock = false;

function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startTest(){
    current = 0;
    count = {A:0,B:0,C:0,D:0};
    lock = false;
    renderQ();
    showPage('page-question');
}

function renderQ(){
    lock = false;
    const item = questions[current];
    document.getElementById('q-index').innerText = current+1;
    document.getElementById('progress').style.width = ((current+1)/9*100)+"%";
    document.getElementById('q-text').innerText = item.q;
    let html = "";
    item.opts.forEach(o=>{
        html += `<div class="opt-item" onclick="selectOpt('${o.type}')">${o.text}</div>`
    })
    document.getElementById('opt-list').innerHTML = html;
}

function selectOpt(type){
    if(lock) return;
    lock = true;
    count[type]++;
    current++;
    setTimeout(()=>{
        if(current >= questions.length){
            showResult();
        }else{
            renderQ();
        }
    },200);
}

function showResult(){
    const arr = [
        {t:'A',v:count.A},
        {t:'B',v:count.B},
        {t:'C',v:count.C},
        {t:'D',v:count.D}
    ];
    arr.sort((a,b)=>b.v - a.v);
    const topVal = arr[0].v;
    const tops = arr.filter(x=>x.v === topVal);

    let noteText = "";
    let mainType;
    if(tops.length>1){
        mainType = tops[0].t;
        const nameMap = {A:"执念型",B:"释然型",C:"和解型",D:"回避型"};
        const names = tops.map(i=>nameMap[i.t]);
        noteText = `⚠️你的结果同分，性格介于【${names.join(" / ")}】之间`;
    }else{
        mainType = tops[0].t;
    }

    const r = results[mainType];
    document.getElementById('res-name').innerText = r.name;
    document.getElementById('res-tag').innerText = r.tag;
    document.getElementById('tieFenNote').innerText = noteText;
    document.getElementById('res-text').innerText = r.desc;
    document.getElementById('res-smalltip').innerText = r.tip;
    showPage('page-result');
}

function restart(){
    showPage('page-home');
}
</script>
</body>
</html>
